apiVersion: v1
kind: Secret
metadata:
  name: auth-center-config
type: Opaque
stringData:
  config.yaml: |
    issuer: https://auth.example.com
    addr: :8080
    cookie_secure: true
    redis_addr: redis:6379
    signing_key: replace-with-base64-pkcs1-rsa-key
    providers:
      - name: github
        type: github
        client_id: replace-me
        client_secret: replace-me
    clients:
      - id: app
        secret: replace-me
        redirect_uris: [https://app.example.com/oauth/callback]
        require_pkce: true
